let state='title',lvl=0,P,E=[],D=[],X=[],M=[],T=[],shake=0,time=0,tx=[];
const LV=[{t:3,n:0,b:0},{t:5,n:0,b:0},{t:4,n:2,b:0},{t:6,n:3,b:0},{t:4,n:2,b:1}];
const rnd=(a,b)=>a+Math.random()*(b-a);
function spr(img,row,fr,x,y,flip,s,al){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.globalAlpha=al??1;ctx.drawImage(img,fr*192,row*192,192,192,-96*s,-108*s,192*s,192*s);ctx.restore()}
function newP(){P={x:W/2,y:H/2+60,hp:6,mx:6,f:1,at:0,sp:0,hit:0,dash:0,dcd:0,scd:0,inv:0,hurt:0,mv:0,kills:0}}
function load(n){lvl=n;E=[];D=[];X=[];M=[];T=[];P.x=W/2;P.y=H/2+60;const L=LV[n];
 const sp=(type,o={})=>{let x,y;do{x=rnd(90,W-90);y=rnd(110,H-80)}while(Math.hypot(x-P.x,y-P.y)<260);E.push(Object.assign({type,x,y,f:-1,hp:type==='n'?2:3,mx:0,s:.85,t:rnd(0,1),st:'c',cd:rnd(.5,1.5),fl:0,hit:0,sp:type==='n'?70:rnd(85,115)+n*8},o));E[E.length-1].mx=E[E.length-1].hp};
 for(let i=0;i<L.t;i++)sp('t');for(let i=0;i<L.n;i++)sp('n');if(L.b)sp('t',{hp:30,s:1.7,sp:80,boss:1});
 for(let i=0;i<14;i++)T.push({x:rnd(20,W-20),y:i%2?rnd(40,75):rnd(H-40,H-20),k:i%3});state='play'}

 if(e.hp<=0){e.dead=1;P.kills++;X.push({x:e.x,y:e.y,t:0,r:40,k:'p'});if(e.boss||Math.random()<.3)M.push({x:e.x,y:e.y})}}
